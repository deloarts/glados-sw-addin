# CI: the merge gate for main, plus MSI builds for release branches and on demand.
#
# Runs on pull requests into main and on pushes to release/** branches, never on
# work-in-progress branches: a runner cannot exercise the add-in (there is no SolidWorks on it),
# so a run only proves the tree builds, the unit tests pass, the ILRepack merge still yields one
# self-contained assembly and the MSI still packages - exactly what a merge gate needs and
# nothing a per-commit run would add. A release branch push yields the candidate MSI to test
# before its PR is merged. workflow_dispatch builds the same artifacts from any branch when a
# testable MSI is wanted before a PR exists. Neither trigger has a path filter: a release
# commit can touch nothing but CHANGELOG.md and still needs its candidate MSI, and these jobs
# are required status checks on pull requests, where a check that a path filter never starts
# stays "pending" and blocks the merge. Pushes to main do not run it again:
# every change reaches main as a squash-merged PR whose checks ran against an up-to-date main
# (required by the main ruleset), so the merge commit's tree was already verified. This never
# publishes anything (see release.yml for that).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["release/**"]
  workflow_dispatch:

# Least privilege: this workflow only reads the repo and uploads build artifacts, it never
# writes back to it.
permissions:
  contents: read

# A newer run on the same PR or branch supersedes the one still in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret scan over the full history of the checked-out ref. Runs the pinned release binary
  # directly, its checksum verified, instead of gitleaks-action.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" gitleaks

      - name: Scan
        run: ./gitleaks git --redact --no-banner --verbose .

  # Runs only for release branches, on their pushes and on their PR into main: the branch name
  # must match the version in AssemblyInfo.cs, CHANGELOG.md needs the section, the tag must
  # still be free, and the branch must contain the current main so the candidate MSI is built
  # from exactly what the merge will tag. Skipped elsewhere, which counts as passing for the
  # required check.
  release-check:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The branch head itself, not the PR merge ref, which always contains main and would
          # hide an outdated branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Check release branch
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [[ ! "$BRANCH" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Release branch '$BRANCH' does not match release/X.Y.Z"
            exit 1
          fi
          pwsh -NoProfile -File scripts/Test-ReleaseVersion.ps1 -Version "${BASH_REMATCH[1]}"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::$BRANCH does not contain the current main, update it from main first."
            exit 1
          fi

  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-packages-${{ runner.os }}-${{ hashFiles('GladosSwAddin/GladosSwAddin.csproj', 'GladosSwAddin.Tests/GladosSwAddin.Tests.csproj', 'GladosSwAddin.Installer/GladosSwAddin.Installer.wixproj') }}
          restore-keys: |
            nuget-packages-${{ runner.os }}-

      - name: Restore NuGet packages
        shell: pwsh
        run: msbuild GladosSwAddin\GladosSwAddin.csproj -t:Restore

      - name: Build add-in (Release)
        shell: pwsh
        # RegisterForComInterop=false is already the csproj's own Release default (see
        # GladosSwAddin.csproj) - passed again here as belt and braces so CI never touches HKCR
        # even if that default is ever changed by mistake.
        run: msbuild GladosSwAddin\GladosSwAddin.csproj /t:Build /p:Configuration=Release /p:RegisterForComInterop=false /nologo /v:m

      - name: Verify merged assembly references no Newtonsoft.Json or SOLIDWORKS interop assembly
        # Windows PowerShell 5.1 (.NET Framework), not pwsh: ReflectionOnlyLoadFrom is not
        # supported on .NET Core/5+.
        shell: powershell
        run: |
          $dllPath = (Resolve-Path "GladosSwAddin\bin\Release\GladosSwAddin.dll").Path
          $asm = [System.Reflection.Assembly]::ReflectionOnlyLoadFrom($dllPath)
          $refs = $asm.GetReferencedAssemblies() | ForEach-Object { $_.Name }
          Write-Output "Referenced assemblies: $($refs -join ', ')"
          $leaked = $refs | Where-Object { $_ -eq "Newtonsoft.Json" -or $_ -like "SolidWorks.Interop.*" }
          if ($leaked) {
            Write-Error "Merged GladosSwAddin.dll still references: $($leaked -join ', ') - ILRepack must internalize Newtonsoft.Json, and SOLIDWORKS interop types must be embedded (EmbedInteropTypes)."
            exit 1
          }

      - name: Build unit tests
        shell: pwsh
        # Also full MSBuild: the test project references the classic add-in project.
        run: msbuild GladosSwAddin.Tests\GladosSwAddin.Tests.csproj -restore /p:Configuration=Release /nologo /v:m

      - name: Run unit tests
        shell: pwsh
        # Runs the prebuilt assembly - `dotnet test` on the project would try to build the
        # classic add-in with the .NET SDK's MSBuild, which cannot.
        run: dotnet test GladosSwAddin.Tests\bin\Release\net48\GladosSwAddin.Tests.dll --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

      - name: Verify installer COM registration matches the assembly
        shell: pwsh
        # Package.wxs authors every COM/SOLIDWORKS registry row by hand; a changed [Guid],
        # ProgId or AssemblyVersion would otherwise ship an MSI that registers a class SOLIDWORKS
        # can't load. regasm /regfile only writes a .reg file - no registry access, no admin.
        run: .github\scripts\Test-ComRegistration.ps1 -DllPath GladosSwAddin\bin\Release\GladosSwAddin.dll -WxsPath GladosSwAddin.Installer\Package.wxs

      - name: Build installer MSI
        shell: pwsh
        # Full MSBuild, not `dotnet build`: the wixproj's ProjectReference pulls in the classic
        # .NET Framework add-in project, which only the Visual Studio MSBuild can compile.
        run: msbuild GladosSwAddin.Installer\GladosSwAddin.Installer.wixproj -restore -p:Configuration=Release -nologo -v:m

      - name: Upload GladosSwAddin.dll
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GladosSwAddin.dll
          path: GladosSwAddin\bin\Release\GladosSwAddin.dll
          if-no-files-found: error

      - name: Upload installer MSI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GladosSwAddin-installer
          path: GladosSwAddin.Installer\bin\x64\Release\GladosSwAddin-*.msi
          if-no-files-found: error
