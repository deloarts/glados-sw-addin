# CodeQL: static security analysis of the C# code and of these workflow files themselves.
#
# Code scanning is free for public repositories and needs GitHub Advanced Security on private
# ones, so every job here skips itself while the repository is private and starts working the
# moment it is made public - no edit needed then. Findings appear under Security -> Code
# scanning. C# is analysed from a real Release build (the same MSBuild invocation as ci.yml):
# the add-in is a classic .NET Framework project, which build-free extraction resolves only
# approximately.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, so newly published CodeQL queries also run against unchanged code.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: ${{ !github.event.repository.private }}
    runs-on: ${{ matrix.language == 'csharp' && 'windows-2025-vs2026' || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Security rules only: code quality is enforced by the build's analyzers
          # (TreatWarningsAsErrors), and the quality suite mostly flags designer-generated code.
          queries: security-extended

      - name: Set up MSBuild
        if: matrix.language == 'csharp'
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0

      - name: Set up .NET SDK
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Build add-in (Release)
        if: matrix.language == 'csharp'
        shell: pwsh
        run: msbuild GladosSwAddin\GladosSwAddin.csproj -restore /t:Build /p:Configuration=Release /p:RegisterForComInterop=false /nologo /v:m

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
